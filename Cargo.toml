[package]
name = "posmail-native"
version = "0.1.0"
edition = "2021"
description = "POS Mail — нативная оболочка Win32 на Rust. Фаза 0: шип скорости ресайза."

# Версии те же, что использует wry 0.57 в Soroka — проверенная связка.
[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[profile.release]
lto = true
codegen-units = 1
