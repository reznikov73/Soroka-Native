[package]
name = "posmail-native"
version = "0.3.18"
edition = "2024"
rust-version = "1.90"
description = "POS Mail — нативная оболочка Win32 на Rust. Фаза 2: мерцание — раунд 4: резиновая полоса сплиттеров — панели не перекладываются в жесте, одна раскладка по отпусканию (TASK-N04)."

# TASK-040 (Soroka): exe называется POSmail.exe
[[bin]]
name = "POSmail"
path = "src/main.rs"

# Оболочка: те же версии, что использует wry 0.57 в Soroka — проверенная связка.
[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

# Почтовое ядро — перенесено из Soroka без изменений (docs/PLAN.md).
# Версии — ровно как в Soroka 0.46.57, чтобы поведение совпадало.
imap = "=3.0.0-alpha.15" # TLS: native-tls (schannel на Windows) — как в Soroka
imap-proto = "0.16"      # флаги папок (\Drafts) и APPENDUID
base64 = "0.23"
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
lettre = "0.11"          # SMTP-отправка; TLS: native-tls
mail-parser = "0.11"     # разбор MIME-тел писем
ammonia = "4"            # санитизация HTML писем
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"          # логи в mail/* — дословный перенос, подписчик не нужен

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
